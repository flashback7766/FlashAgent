name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The release workflow runs this first and builds nothing if it fails.
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --no-fail-fast

  # Clippy is a whole second compilation of the workspace, and it used to run
  # after the tests in the same job, so the matrix waited for both in turn. Its
  # own job runs at the same time as the tests instead.
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Strict Clippy verification
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The oldest Rust the README and CONTRIBUTING.md promise (rust-version in
  # Cargo.toml). The floor comes from dependencies in Cargo.lock (icu_*,
  # image), not only from our own code; change it in all four places at once.
  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check the workspace
        run: cargo check --workspace --all-targets
