name: Release

on:
  push:
    tags:
      - 'v*'
      - 'b[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (Arch, Debian, Void, AppImage, Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zstd libfuse2

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Compile and Package All Linux Distros
        run: |
          ./packaging/build-all.sh "${{ github.ref_name }}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    name: Build Windows (MSVC x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Binary
        env:
          FLASHAGENT_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target x86_64-pc-windows-msvc -p flashagent-tui

      - name: Package Windows Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          mkdir dist
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/flashagent-tui.exe, README.md, LICENSE -DestinationPath "dist/flashagent-windows-$ver-x86_64.zip"
          Copy-Item "dist/flashagent-windows-$ver-x86_64.zip" "dist/flashagent-windows-x86_64.zip"
          # Raw executable for the in-app updater, which never unpacks zips.
          Copy-Item target/x86_64-pc-windows-msvc/release/flashagent-tui.exe "dist/flashagent-windows-x86_64.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            dist/flashagent-windows-*.zip
            dist/flashagent-windows-*.exe

  build-macos:
    name: Build macOS (Apple Silicon ARM64 & Intel x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build macOS Apple Silicon (ARM64)
        env:
          FLASHAGENT_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target aarch64-apple-darwin -p flashagent-tui

      - name: Build macOS Intel (x86_64)
        env:
          FLASHAGENT_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target x86_64-apple-darwin -p flashagent-tui

      - name: Package macOS Binaries
        run: |
          TAG="${{ github.ref_name }}"
          mkdir dist
          tar -czf "dist/flashagent-macos-${TAG}-aarch64.tar.gz" -C target/aarch64-apple-darwin/release flashagent-tui
          tar -czf "dist/flashagent-macos-${TAG}-x86_64.tar.gz" -C target/x86_64-apple-darwin/release flashagent-tui
          tar -czf dist/flashagent-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release flashagent-tui
          tar -czf dist/flashagent-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release flashagent-tui

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Beta builds (bNNN) publish to the rolling `beta` pre-release,
          # stable versions (vX.Y.Z) to the rolling `stable` release.
          if [[ "${VERSION}" =~ ^b[0-9]+$ ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "flags=--prerelease --latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=stable" >> "$GITHUB_OUTPUT"
            echo "flags=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          cat > release_body.md << EOF
          ## FlashAgent ${VERSION}

          Local-first AI coding agent in native Rust. Full change list: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md).

          ### Install
          - **Linux / macOS**: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | FLASHAGENT_CHANNEL=beta bash\`
          - **Windows**: \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex\`
          - **Already installed**: \`flashagent --update\` (downloads are verified against \`SHA256SUMS\`)

          ### Packages
          - Arch Linux: \`flashagent-bin-${VERSION}-1-x86_64.pkg.tar.zst\`
          - Debian / Ubuntu: \`flashagent_${VERSION}-1_amd64.deb\`
          - AppImage: \`FlashAgent-${VERSION}-x86_64.AppImage\`
          - Void Linux: \`flashagent-${VERSION}-void-linux-x86_64.tar.gz\`
          - Generic Linux: \`flashagent-${VERSION}-linux-x86_64.tar.gz\`
          - Windows: \`flashagent-windows-${VERSION}-x86_64.zip\` (raw \`flashagent-windows-x86_64.exe\` for the updater)
          - macOS: \`flashagent-macos-${VERSION}-aarch64.tar.gz\` (Apple Silicon) / \`flashagent-macos-${VERSION}-x86_64.tar.gz\` (Intel)
          EOF

      - name: Publish to the rolling channel release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
          VERSION: ${{ steps.channel.outputs.version }}
          FLAGS: ${{ steps.channel.outputs.flags }}
        run: |
          # Recreated for every build: clients that list releases by creation
          # date must see the channel release first, and no asset from an older
          # build may linger next to the new ones. Each build stays reachable
          # through its own version tag (git tag ${VERSION}).
          gh release delete "${CHANNEL_TAG}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          # shellcheck disable=SC2086
          gh release create "${CHANNEL_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FlashAgent ${VERSION}" \
            --notes-file release_body.md \
            ${FLAGS}
