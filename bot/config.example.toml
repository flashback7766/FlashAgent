# FlashAgent Telegram bot — config for one deployment (a project group).
# Copy to bot.toml next to the bot and fill in.

[telegram]
# The token BotFather gave the bot.
token = "123456:ABC..."
# The group the bot sits in and listens to (the supergroup's -100... id).
group_id = -1000000000000
# The channel posts go to when the draft is approved (may equal group_id).
channel_id = -1000000000000
# Telegram user ids allowed to run commands (the owner and the second developer).
admin_ids = [111111111]

[serve]
# flashagent --serve on the same machine.
url = "http://127.0.0.1:8081"
# The same value FLASHAGENT_SERVE_TOKEN gave the server; empty when the
# server runs without a token.
token = ""

[brain]
# How many last group messages ride along as context with every ask.
context_messages = 30
# Polling cadence while a turn runs, seconds.
poll_interval = 1.0
