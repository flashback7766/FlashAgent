# FlashAgent Telegram bot — config for one deployment.
# Copy to bot.toml next to the bot and fill in.

[telegram]
# The token BotFather gave the bot.
token = "123456:ABC..."
# The channel posts go to when a draft is approved.
channel_id = -1000000000000
# Telegram user ids allowed to run commands (the owner and the second developer).
admin_ids = [111111111, 222222222]

# One backend per room: its own session, its own vault, its own tier.
[serve.dev]
url = "http://127.0.0.1:8093"
token = "change-me"

[serve.users]
url = "http://127.0.0.1:8094"
token = "change-me"

# The developer room: the whole brain — plans, tools, memory, approvals.
[chat.dev]
chat_id = -1000000000001
serve = "dev"
context_messages = 30

# The users' room: reports and questions, on the compact tier, and the bot
# speaks only when addressed — nobody's tokens burn on silence.
[chat.users]
chat_id = -1000000000002
serve = "users"
context_messages = 10
