[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
unicode-width = "0.2"
unicode-segmentation = "1.12"
rayon = "1.10"

# Tests carry no symbols worth reading: a backtrace through an assert! names a
# test, not a line inside a dependency. Debug info is the bulk of what cargo
# spends building this workspace, and it is spent again on every CI run on three
# systems, so it is switched off where nobody looks at it.
[profile.test]
debug = 0
strip = "debuginfo"

# Integration scenarios spawn the real binary in a pty. Same reasoning, and it
# is these that pay for it most: a debug-less binary links faster to run.
[profile.dev]
debug = 0

